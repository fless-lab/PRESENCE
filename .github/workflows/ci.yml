name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  serveur:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: presence
          POSTGRES_PASSWORD: presence
          POSTGRES_DB: presence_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: serveur
    env:
      PRESENCE_TEST_PG: postgresql+psycopg://presence:presence@localhost:5432/presence_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  passerelle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registre/passerelle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  chaincode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registre/chaincode/ancrage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: go mod tidy
      - run: go vet ./...
      - run: go build ./...

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cible: [esp32, esp32s3]
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: ${{ matrix.cible }}
          path: firmware/observateur

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: presence-debug-apk
          path: app-android/app/build/outputs/apk/debug/app-debug.apk
