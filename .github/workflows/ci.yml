name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  serveur:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serveur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  chaincode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registre/chaincode/ancrage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: go mod tidy
      - run: go vet ./...
      - run: go build ./...
